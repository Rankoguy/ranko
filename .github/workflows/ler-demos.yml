name: Ler partidas (demos)
on:
  schedule:
    - cron: '7,37 * * * *'   # a cada 30 minutos (e também sob demanda, pelo Worker)
  workflow_dispatch:
    inputs:
      incluir_inicial:
        description: 'Teste: ler também a partida do código colado (digite sim)'
        default: 'nao'
      testar_leitores:
        description: 'Teste dos leitores de demo: abre 2 demos com cada leitor e mostra o resultado, sem gravar nada (digite sim)'
        default: 'nao'
      depurar_rating:
        description: 'Teste do rating: mostra no log os nomes dos campos do perfil, sem valores (digite sim)'
        default: 'nao'
permissions:
  contents: read   # o robô só precisa LER o código; não pode escrever no repositório
concurrency:
  group: ler-demos
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: demos
      - name: Instalar leitores extras (só no teste dos leitores)
        if: ${{ inputs.testar_leitores == 'sim' }}
        working-directory: demos
        run: npm install --no-save --no-audit --no-fund dp0413@npm:@laihoe/demoparser2@0.41.3 dp0410@npm:@laihoe/demoparser2@0.41.0 dp0403@npm:@laihoe/demoparser2@0.40.3 cs2parser
      - name: Preparar o Go (só no teste dos leitores)
        if: ${{ inputs.testar_leitores == 'sim' }}
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Compilar o leitor Go (só no teste dos leitores)
        if: ${{ inputs.testar_leitores == 'sim' }}
        working-directory: demos/leitor-go
        run: |
          go mod init leitor-go
          go get github.com/markus-wa/demoinfocs-golang/v5@v5.2.0
          go mod tidy
          go build -o go-estavel .
          go get github.com/markus-wa/demoinfocs-golang/v5@master
          go mod tidy
          go build -o go-master . || echo "a versão em desenvolvimento não compilou"
      - name: Ler partidas novas
        working-directory: demos
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ROBO_SECRET: ${{ secrets.ROBO_SECRET }}
          INCLUIR_INICIAL: ${{ inputs.incluir_inicial }}
          DEPURAR_RATING: ${{ inputs.depurar_rating }}
          TESTAR_LEITORES: ${{ inputs.testar_leitores }}
        run: node ler-demos.mjs
