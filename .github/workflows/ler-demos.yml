name: Ler partidas (demos)
on:
  schedule:
    - cron: '7,37 * * * *'   # a cada 30 minutos (e também sob demanda, pelo Worker)
  workflow_dispatch:
    inputs:
      incluir_inicial:
        description: 'Teste: ler também a partida do código colado (digite sim)'
        default: 'nao'
      conferir:
        description: 'Conferência: lê até 4 partidas e mostra placar e totais no log, sem gravar nada (digite sim)'
        default: 'nao'
      depurar_rating:
        description: 'Teste do rating: mostra no log os nomes dos campos do perfil, sem valores (digite sim)'
        default: 'nao'
permissions:
  contents: read   # o robô só precisa LER o código; não pode escrever no repositório
concurrency:
  group: ler-demos
  cancel-in-progress: false
jobs:
  ler:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      # versões travadas por código (não por nome), para ninguém conseguir trocar o que roda aqui
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # instala exatamente o que está no package-lock.json (versões e conferência de integridade),
      # sem rodar scripts de instalação das bibliotecas
      - name: Instalar bibliotecas (lista fechada)
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: demos
      - name: Ler partidas novas
        working-directory: demos
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_REFRESH_TOKEN: ${{ secrets.STEAM_REFRESH_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ROBO_SECRET: ${{ secrets.ROBO_SECRET }}
          INCLUIR_INICIAL: ${{ inputs.incluir_inicial }}
          DEPURAR_RATING: ${{ inputs.depurar_rating }}
          CONFERIR: ${{ inputs.conferir }}
        run: node ler-demos.mjs
